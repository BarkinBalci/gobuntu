name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "0 13 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSIONS: '["1.25", "1.26"]'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Prepare versions
    runs-on: ubuntu-latest
    outputs:
      go-versions: ${{ steps.versions.outputs.go-versions }}
      default-go-version: ${{ steps.versions.outputs.default-go-version }}
    steps:
      - name: Export Go versions
        id: versions
        run: |
          echo "go-versions=${GO_VERSIONS}" >> "$GITHUB_OUTPUT"
          echo "default-go-version=$(echo "$GO_VERSIONS" | jq -r '.[-1]')" >> "$GITHUB_OUTPUT"

  build:
    name: Build Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    needs: versions
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        go-version: ${{ fromJSON(needs.versions.outputs.go-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image name
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.image }}
          labels: |
            org.opencontainers.image.title=gobuntu
            org.opencontainers.image.description=Rolling Ubuntu image for Go development tools
          tags: |
            type=raw,value=go${{ matrix.go-version }},enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ !startsWith(github.ref, 'refs/tags/v') && matrix.go-version == needs.versions.outputs.default-go-version }}
            type=raw,value=go${{ matrix.go-version }}-${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=go${{ matrix.go-version }}-{{date 'YYYYMMDD'}},enable=${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=go${{ matrix.go-version }}-

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            GO_VERSION=${{ matrix.go-version }}
            UBUNTU_VERSION=rolling
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=go${{ matrix.go-version }}
          cache-to: type=gha,mode=max,scope=go${{ matrix.go-version }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Create release notes
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          {
            echo "## Images"
            echo
            echo "$GO_VERSIONS" | jq -r --arg image "$image" --arg tag "$GITHUB_REF_NAME" '.[] | "- \($image):go\(.)-\($tag)"'
          } > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
