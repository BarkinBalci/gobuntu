name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/barkinbalci/gobuntu
  IMAGE_TITLE: gobuntu
  IMAGE_DESCRIPTION: Downstream Ubuntu image for running Go coding agents.
  UBUNTU_VERSION: "26.04"
  PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.25"
          - "1.26"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          build-args: |
            GO_VERSION=${{ matrix.go-version }}
            UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=go${{ matrix.go-version }}
          cache-to: type=gha,mode=max,scope=go${{ matrix.go-version }}

  publish:
    name: Publish Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.25"
          - "1.26"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
          tags: |
            type=raw,value=go${{ matrix.go-version }}-${{ github.ref_name }}
            type=raw,value=go${{ matrix.go-version }}
            type=raw,value=latest,enable=${{ matrix.go-version == '1.26' }}
            type=sha,prefix=go${{ matrix.go-version }}-

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            GO_VERSION=${{ matrix.go-version }}
            UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=go${{ matrix.go-version }}
          cache-to: type=gha,mode=max,scope=go${{ matrix.go-version }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "## Images

          - $IMAGE_NAME:go1.25-$GITHUB_REF_NAME
          - $IMAGE_NAME:go1.26-$GITHUB_REF_NAME"
